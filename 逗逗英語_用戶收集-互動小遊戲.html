<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>逗逗英語 Todo English - 展場限定抽好禮</title>
    <!-- Canvas Confetti 彩帶特效庫 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --brand-purple: #383378;
            --brand-orange: #FF6B35;
            --brand-blue: #00A3E0;
            --brand-yellow: #FFC72C;
            --brand-pink: #E83E8C;
            --bg-sky: #A2E2EC;
            --card-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #A2E2EC 0%, #E0F7FA 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        /* 頂部 Header 品牌列 */
        header {
            width: 100%;
            background: #FFFFFF;
            padding: 12px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(56, 51, 120, 0.12);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        header img.logo {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .main-container {
            width: 92%;
            max-width: 440px;
            margin: 20px auto 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* IP 吉祥物頭像區塊 */
        .mascot-badge {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #FFFFFF;
            padding: 4px;
            box-shadow: 0 8px 20px rgba(56, 51, 120, 0.25);
            margin-bottom: -48px;
            z-index: 10;
            position: relative;
            animation: bounce 2s infinite ease-in-out;
            overflow: hidden;
        }

        .mascot-badge img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 主卡片容器 */
        .game-card {
            width: 100%;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 58px 20px 25px;
            box-shadow: 0 12px 32px rgba(56, 51, 120, 0.18);
            backdrop-filter: blur(8px);
            text-align: center;
            border: 3px solid #FFFFFF;
        }

        .game-card h2 {
            margin: 0 0 6px;
            color: var(--brand-purple);
            font-size: 1.45rem;
            font-weight: 800;
        }

        .game-card p.subtitle {
            margin: 0 0 20px;
            color: #666;
            font-size: 0.9rem;
        }

        /* 頁籤切換 */
        .tab-buttons {
            display: flex;
            background: #EAEBF5;
            padding: 4px;
            border-radius: 30px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--brand-purple);
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--brand-purple);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(56, 51, 120, 0.3);
        }

        /* 遊戲區域 */
        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        /* 刮刮樂 Canvas */
        .scratch-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            border: 4px solid var(--brand-yellow);
        }

        .scratch-award {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #FFF9E6 0%, #FFE699 100%);
            color: var(--brand-purple);
            font-size: 1.25rem;
            font-weight: bold;
            padding: 20px;
        }

        #scratchCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }

        /* 大轉盤 */
        .wheel-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin: 0 auto;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.35, 1);
        }

        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 42px;
            background: var(--brand-orange);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .spin-btn {
            margin-top: 20px;
            width: 85%;
            padding: 14px 0;
            font-size: 1.1rem;
            font-weight: 800;
            color: #FFFFFF;
            background: linear-gradient(135deg, var(--brand-orange) 0%, #FF8C00 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(255, 107, 53, 0.4);
            transition: transform 0.1s;
        }

        .spin-btn:active {
            transform: scale(0.96);
        }

        /* 中獎 Modal 彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(56, 51, 120, 0.75);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #FFFFFF;
            width: 88%;
            max-width: 360px;
            padding: 25px 20px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: popup 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-mascot {
            width: 75px;
            height: 75px;
            margin: -55px auto 10px;
            border-radius: 50%;
            border: 3px solid #FFFFFF;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            overflow: hidden;
            background: #FFFFFF;
        }

        .modal-mascot img {
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }

        @keyframes popup {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal h3 {
            margin: 5px 0;
            color: var(--brand-purple);
            font-size: 1.3rem;
        }

        .cta-btn {
            display: block;
            width: 100%;
            padding: 13px 0;
            margin-top: 10px;
            border-radius: 25px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-app { background: var(--brand-purple); color: #FFFFFF; }
        .btn-line { background: #06C755; color: #FFFFFF; }
    </style>
</head>
<body>

    <!-- 頂部官方 Logo 列 -->
    <header>
        
    </header>

    <div class="main-container">
        <!-- IP 吉祥物圓形徽章 -->
        <div class="mascot-badge">
            <img src="https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/b6/7a/b9/b67ab995-4c2b-73aa-a58e-7da5ad91c5ce/Placeholder.mill/400x400bb-75.webp" 
                 alt="逗逗英語吉祥物"
                 crossorigin="anonymous">
        </div>

        <!-- 主卡片容器 -->
        <div class="game-card">
            <h2>🎉 展場限定抽好禮</h2>
            <p class="subtitle">追蹤粉專即可參與互動拿大獎！</p>

            <!-- 頁籤選擇 -->
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchGame('scratch')">✨ 即時刮刮樂</button>
                <button class="tab-btn" onclick="switchGame('wheel')">🎡 挑戰大轉盤</button>
            </div>

            <!-- 遊戲區 A：刮刮樂 -->
            <div id="scratchGame" class="game-section active">
                <div class="scratch-container">
                    <div class="scratch-award">
                        <span id="scratchAwardText">🎁 14 天全功能免費體驗序號</span>
                    </div>
                    <canvas id="scratchCanvas" width="260" height="260"></canvas>
                </div>
            </div>

            <!-- 遊戲區 B：大轉盤 -->
            <div id="wheelGame" class="game-section">
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <canvas id="wheelCanvas" width="260" height="260"></canvas>
                </div>
                <button class="spin-btn" onclick="spinWheel()">旋轉抽大獎！</button>
            </div>
        </div>
    </div>

    <!-- 中獎彈窗 Modal -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <div class="modal-mascot">
                <img src="https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/b6/7a/b9/b67ab995-4c2b-73aa-a58e-7da5ad91c5ce/Placeholder.mill/400x400bb-75.webp" 
                     alt="恭喜獲獎"
                     crossorigin="anonymous">
            </div>
            <h3>🎉 恭喜幸運中獎！</h3>
            <p id="modalAwardName" style="font-size: 1.15rem; font-weight: bold; color: var(--brand-orange); margin: 10px 0;"></p>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">請向現場工作人員出示此畫面領取好禮！</p>
            
            <a href="https://todoenglish.tw/" target="_blank" class="cta-btn btn-app">📲 點我下載 App 免費試用 7 天</a>
            <a href="https://line.me/" target="_blank" class="cta-btn btn-line">💬 綁定 LINE 接收每日學習報告</a>
        </div>
    </div>

    <script>
        // --- 頁籤切換邏輯 ---
        function switchGame(gameType) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.game-section').forEach(sec => sec.classList.remove('active'));
            
            if (gameType === 'scratch') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('scratchGame').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('wheelGame').classList.add('active');
            }
        }

        // --- 刮刮樂 Canvas 邏輯 ---
        const scratchCanvas = document.getElementById('scratchCanvas');
        const ctx = scratchCanvas.getContext('2d');
        let isScratched = false;

        function initScratch() {
            ctx.fillStyle = '#383378';
            ctx.fillRect(0, 0, 260, 260);
            ctx.fillStyle = '#FFE66D';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('✨ 刮開塗層解鎖好禮 ✨', 130, 135);
        }
        initScratch();

        function scratch(e) {
            const rect = scratchCanvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();

            checkScratchPercentage();
        }

        function checkScratchPercentage() {
            if (isScratched) return;
            const imageData = ctx.getImageData(0, 0, 260, 260);
            let transparentPixels = 0;
            for (let i = 3; i < imageData.data.length; i += 4) {
                if (imageData.data[i] === 0) transparentPixels++;
            }
            if (transparentPixels / (260 * 260) > 0.45) {
                isScratched = true;
                ctx.clearRect(0, 0, 260, 260);
                showResult('🎁 14 天全功能免費體驗序號');
            }
        }

        scratchCanvas.addEventListener('mousemove', (e) => { if (e.buttons === 1) scratch(e); });
        scratchCanvas.addEventListener('touchmove', scratch);

        // --- 大轉盤 Canvas 邏輯 ---
        const wheelCanvas = document.getElementById('wheelCanvas');
        const wCtx = wheelCanvas.getContext('2d');
        const prizes = ["7-11 禮券", "免費試用14天", "英文體驗教材", "逗逗英文著色本", "逗逗英文貼紙組", "逗逗英文故事書"];
        const colors = ["#383378", "#FF6B35", "#00A3E0", "#FFC72C", "#E83E8C", "#4ECDC4"];
        let isSpinning = false;

        function drawWheel() {
            const numPrizes = prizes.length;
            const arc = (Math.PI * 2) / numPrizes;

            for (let i = 0; i < numPrizes; i++) {
                const angle = i * arc;
                wCtx.beginPath();
                wCtx.fillStyle = colors[i];
                wCtx.moveTo(130, 130);
                wCtx.arc(130, 130, 130, angle, angle + arc);
                wCtx.fill();

                wCtx.save();
                wCtx.translate(130, 130);
                wCtx.rotate(angle + arc / 2);
                wCtx.textAlign = "right";
                wCtx.fillStyle = "#FFF";
                wCtx.font = "bold 13px sans-serif";
                wCtx.fillText(prizes[i], 110, 4);
                wCtx.restore();
            }
        }
        drawWheel();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const prizeIndex = Math.floor(Math.random() * prizes.length);
            const degreePerPrize = 360 / prizes.length;
            const targetDegree = 360 * 5 + (360 - (prizeIndex * degreePerPrize + degreePerPrize / 2));

            wheelCanvas.style.transform = `rotate(${targetDegree}deg)`;

            setTimeout(() => {
                showResult(prizes[prizeIndex]);
                isSpinning = false;
            }, 4000);
        }

        // --- 顯示結果與彩帶特效 ---
        function showResult(awardName) {
            document.getElementById('modalAwardName').innerText = awardName;
            document.getElementById('resultModal').style.display = 'flex';
            
            // 觸發彩帶動畫
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
